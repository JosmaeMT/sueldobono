<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practica 11</title>
    <link rel="stylesheet" href="estilos_tabla.css">
</head>
<body>
<script>
    let bono = 1200
    let sq = 15000

    // Datos de una sola persona
    let nombre = prompt("Ingrese Nombre")
    let dt = Number(prompt("Ingrese dias trabajados"))
    let antiguedad = Number(prompt("Ingrese Antiguedad"))

    let sueldo = (sq / 15) * dt
    let bonoGanado = 0

    if (antiguedad >= 10) {
        bonoGanado = bono
    }

    let total = sueldo + bonoGanado

    document.write("<div class='contenedor'>")
    document.write("<h1>Nómina de empleados</h1>")
    document.write("<p class='subtitulo'>Práctica 11</p>")
    document.write("<div class='tarjeta'><div class='tabla-scroll'>")

    document.write("<table border='1' cellpadding='8'>")
    document.write("<tr>")
    document.write("<th>#</th>")
    document.write("<th>Nombre</th>")
    document.write("<th>Días Trab.</th>")
    document.write("<th>Antigüedad</th>")
    document.write("<th>Sueldo</th>")
    document.write("<th>Bono</th>")
    document.write("<th>Total</th>")
    document.write("</tr>")

    // 4 filas: la 1 con datos y las otras 3 vacías
    for (let a = 1; a <= 4; a++) {
        document.write("<tr>")
        document.write("<td>" + a + "</td>")

        if (a == 1) {
            document.write("<td class='nombre'>" + nombre + "</td>")
            document.write("<td>" + dt + "</td>")
            document.write("<td>" + antiguedad + " años</td>")
            document.write("<td>$" + sueldo + "</td>")
            document.write("<td>$" + bonoGanado + "</td>")
            document.write("<td class='total'>$" + total + "</td>")
        } else {
            document.write("<td></td><td></td><td></td><td></td><td></td><td></td>")
        }

        document.write("</tr>")
    }

    document.write("</table>")
    document.write("</div></div></div>")
</script>
</body>
</html>
